limit_req_zone $binary_remote_addr zone=scans:10m rate=60r/m;
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        limit_req zone=scans burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/;
        proxy_read_timeout 35s;
        proxy_connect_timeout 3s;
        access_log off;
    }
    location ~* \.(joblib|pt|pkl)$ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
